<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c89b3c">
<title>OKB Pro Live Trading & Market</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/common.css">

<style>
/* =========================================================
   OKB GOLD & CREAM PRO TRADING THEME
   ========================================================= */
:root {
    --primary-gold: #c89b3c;
    --primary-gold-dark: #a67c27;
    --gold-light: #fff7df;
    --bg-white: #f8fafc;
    --card-bg: #ffffff;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --border-color: rgba(200, 155, 60, 0.35);
    --shadow-sm: 0 4px 15px rgba(0, 0, 0, 0.05);
    --shadow-md: 0 10px 25px rgba(200, 155, 60, 0.15);
    
    --trading-green: #10b981;
    --trading-red: #ef4444;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-white);
    color: var(--text-main);
    min-height: 100vh;
    padding-bottom: 40px;
    overflow-x: hidden;
}

.crypto-app {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
    position: relative;
}

/* HEADER */
.crypto-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(135deg, #ffffff, #fff7df);
    padding: 12px 16px;
    border-radius: 20px;
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-sm);
    margin-bottom: 16px;
}

.back-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    background: #fff;
    border: 1px solid var(--border-color);
    border-radius: 50%;
    text-decoration: none;
    color: var(--primary-gold-dark);
    font-size: 18px;
    font-weight: bold;
    box-shadow: var(--shadow-sm);
    transition: 0.2s;
}

.back-btn:hover {
    background: var(--primary-gold);
    color: #fff;
}

.header-title {
    font-size: 16px;
    font-weight: 800;
    color: var(--primary-gold-dark);
    letter-spacing: 0.5px;
}

.header-logo img {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1.5px solid var(--primary-gold);
    object-fit: cover;
}

/* CARD COMMON STYLE */
.pro-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
}

/* BALANCE CARD */
.balance-card {
    background: linear-gradient(135deg, #ffffff 0%, #fff9e9 100%);
    border: 1.5px solid var(--primary-gold);
}

.balance-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
}

.balance-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
}

.live-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    font-weight: 800;
    color: var(--trading-green);
    background: rgba(16, 185, 129, 0.12);
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid rgba(16, 185, 129, 0.3);
}

.live-dot {
    width: 6px;
    height: 6px;
    background: var(--trading-green);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--trading-green);
    animation: blink 1s infinite alternate;
}

@keyframes blink {
    from { opacity: 0.3; }
    to { opacity: 1; }
}

.balance-value {
    font-size: 28px;
    font-weight: 900;
    color: var(--primary-gold-dark);
    margin-bottom: 12px;
}

/* ASSET CONVERSION GRID */
.assets-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 12px;
    border-top: 1px solid var(--border-color);
    padding-top: 12px;
}

.asset-box {
    background: #fffdf7;
    border: 10px solid rgba(200, 155, 60, 0.25);
    padding: 0px 12px;
    border-radius: 12px;
}

.asset-title {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 700;
}

.asset-val {
    font-size: 13px;
    font-weight: 800;
    color: var(--text-main);
    margin-top: 2px;
}

/* TOTAL MARKET CAP & POOL INFO */
.market-cap-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    color: #fff;
    padding: 14px 16px;
    border-radius: 16px;
    margin-bottom: 16px;
    border: 1px solid var(--primary-gold);
    box-shadow: var(--shadow-md);
}

.cap-info span {
    display: block;
    font-size: 10px;
    color: var(--primary-gold);
    text-transform: uppercase;
    font-weight: 700;
}

.cap-info strong {
    font-size: 16px;
    font-weight: 900;
}

/* CANDLESTICK TRADING SECTION */
.trading-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.coin-details h3 {
    font-size: 17px;
    font-weight: 900;
    color: var(--text-main);
}

.coin-details span {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 600;
}

.live-price-tag {
    font-size: 22px;
    font-weight: 900;
    color: var(--primary-gold-dark);
}

.price-change-pill {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 800;
    margin-top: 4px;
}

.up { background: rgba(16, 185, 129, 0.15); color: var(--trading-green); }
.down { background: rgba(239, 68, 68, 0.15); color: var(--trading-red); }

/* CANDLESTICK CANVAS WRAPPER */
.candlestick-wrapper {
    width: 100%;
    height: 180px;
    background: #0f172a;
    border-radius: 14px;
    position: relative;
    border: 1.5px solid var(--primary-gold);
    overflow: hidden;
    margin-top: 12px;
}

canvas#candlestickCanvas {
    width: 100%;
    height: 100%;
    display: block;
}

/* POPULAR MARKET LIST */
.market-list-title {
    font-size: 15px;
    font-weight: 800;
    margin-bottom: 12px;
    color: var(--text-main);
}

.coin-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px;
    background: #fff;
    border: 1px solid var(--border-color);
    border-radius: 14px;
    margin-bottom: 8px;
    transition: 0.2s;
}

.coin-row:hover {
    border-color: var(--primary-gold);
    transform: translateY(-2px);
}

.row-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.coin-icon-img {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid var(--border-color);
}

.row-name {
    font-size: 13px;
    font-weight: 800;
}

.row-symbol {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 700;
}

.row-right {
    text-align: right;
    font-size: 13px;
    font-weight: 800;
}
</style>
</head>

<body>

<div class="crypto-app">

    <!-- TOP HEADER -->
    <header class="crypto-header">
        <a href="dashboard.html" class="back-btn" title="Back">←</a>
        <div class="header-title">OKB PRO MARKET</div>
        <div class="header-logo">
            <img src="https://i.postimg.cc/FzGmnmX4/myokbi.png" alt="OKB Logo">
        </div>
    </header>

    <!-- LIVE USER BALANCE CARD -->
    <section class="pro-card balance-card">
        <div class="balance-top">
            <div class="balance-label">Main Balance (BDT)</div>
            <div class="live-badge">
                <span class="live-dot"></span> REALTIME SYNC
            </div>
        </div>
        <div class="balance-value" id="userMainBalance">৳0.00</div>

        <div class="assets-grid">
            <div class="asset-box">
                <div class="asset-title">Est. USD ($)</div>
                <div class="asset-val" id="usdVal">$0.00</div>
            </div>
            <div class="asset-box">
                <div class="asset-title">OKB Holding</div>
                <div class="asset-val" id="okbQty">0.0000 OKB</div>
            </div>
            <div class="asset-box">
                <div class="asset-title">BTC Holding</div>
                <div class="asset-val" id="btcQty">0.00000 BTC</div>
            </div>
            <div class="asset-box">
                <div class="asset-title">ETH Holding</div>
                <div class="asset-val" id="ethQty">0.00000 ETH</div>
            </div>
        </div>
    </section>

    <!-- COMPANY POOL / TOTAL MARKET VALUE -->
    <div class="market-cap-bar">
        <div class="cap-info">
            <span>OKB Platform Market Cap</span>
            <strong id="platformMarketCap">$0.00 USD</strong>
        </div>
        <div style="font-size: 20px;">💎</div>
    </div>

    <!-- LIVE CANDLESTICK TRADING CHART CARD -->
    <section class="pro-card">
        <div class="trading-header">
            <div class="coin-details">
                <h3>OKB / USDT</h3>
                <span>Real-Time Candlestick Engine</span>
            </div>
            <div style="text-align: right;">
                <div class="live-price-tag" id="liveOkbPrice">$0.0000</div>
                <div class="price-change-pill up" id="liveOkbChange">▲ +0.00%</div>
            </div>
        </div>

        <!-- REAL-TIME CANDLESTICK CANVAS -->
        <div class="candlestick-wrapper">
            <canvas id="candlestickCanvas"></canvas>
        </div>
    </section>

    <!-- POPULAR ASSETS LIST -->
    <div class="market-list-title">Market Overview</div>
    <div id="cryptoListContainer">
        <!-- Dynamic Crypto Rows rendered via JavaScript -->
    </div>

</div>

<!-- FIREBASE & TRADING ENGINE SCRIPT -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
    databaseURL: "https://okb2-ee83b-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// GLOBAL STATE
let currentBdtBalance = 0;
let okbPrice = 45.20; // Base OKB Price
let btcPrice = 65000;
let ethPrice = 35000;
const BDT_TO_USD = 118; // 1 USD = 118 BDT

// Candlestick Data Array (15 Candles)
let candles = [];
const TOTAL_CANDLES = 18;

// Init Candlesticks with random data
function initCandles() {
    let basePrice = okbPrice;
    for (let i = 0; i < TOTAL_CANDLES; i++) {
        let open = basePrice + (Math.random() * 0.4 - 0.2);
        let close = open + (Math.random() * 0.6 - 0.3);
        let high = Math.max(open, close) + Math.random() * 0.2;
        let low = Math.min(open, close) - Math.random() * 0.2;
        candles.push({ open, high, low, close });
        basePrice = close;
    }
}
initCandles();

// 1. UPDATE ASSET CALCULATIONS
function updateCalculations() {
    const usdValue = currentBdtBalance / BDT_TO_USD;
    document.getElementById("usdVal").textContent = "$" + usdValue.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    if (okbPrice > 0) {
        document.getElementById("okbQty").textContent = (usdValue / okbPrice).toFixed(4) + " OKB";
    }
    if (btcPrice > 0) {
        document.getElementById("btcQty").textContent = (usdValue / btcPrice).toFixed(5) + " BTC";
    }
    if (ethPrice > 0) {
        document.getElementById("ethQty").textContent = (usdValue / ethPrice).toFixed(4) + " ETH";
    }
}

// 2. REAL-TIME CANDLESTICK RENDER ENGINE (Millisecond Dynamic Animation)
function drawCandlestickChart() {
    const canvas = document.getElementById("candlestickCanvas");
    if (!canvas) return;

    const box = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = box.width * dpr;
    canvas.height = box.height * dpr;

    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, box.width, box.height);

    // Min Max prices for scaling
    let allPrices = candles.flatMap(c => [c.low, c.high]);
    let minPrice = Math.min(...allPrices);
    let maxPrice = Math.max(...allPrices);
    let range = (maxPrice - minPrice) || 1;

    const padding = 15;
    const chartHeight = box.height - padding * 2;
    const candleWidth = (box.width / TOTAL_CANDLES) * 0.65;
    const gap = box.width / TOTAL_CANDLES;

    candles.forEach((c, i) => {
        const x = i * gap + gap / 2;
        const isGreen = c.close >= c.open;
        const color = isGreen ? "#06ffac" : "#ef4444";

        const yHigh = padding + chartHeight - ((c.high - minPrice) / range) * chartHeight;
        const yLow = padding + chartHeight - ((c.low - minPrice) / range) * chartHeight;
        const yOpen = padding + chartHeight - ((c.open - minPrice) / range) * chartHeight;
        const yClose = padding + chartHeight - ((c.close - minPrice) / range) * chartHeight;

        // Draw Wick (High to Low Line)
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x, yHigh);
        ctx.lineTo(x, yLow);
        ctx.stroke();

        // Draw Candle Body
        const bodyY = Math.min(yOpen, yClose);
        const bodyHeight = Math.max(Math.abs(yOpen - yClose), 2);
        ctx.fillStyle = color;
        ctx.fillRect(x - candleWidth / 2, bodyY, candleWidth, bodyHeight);

        // Draw Volume Bar at Bottom
        const volHeight = Math.random() * 25 + 5;
        ctx.fillStyle = isGreen ? "rgba(16, 185, 129, 0.25)" : "rgba(239, 68, 68, 0.25)";
        ctx.fillRect(x - candleWidth / 2, box.height - volHeight, candleWidth, volHeight);
    });
}

// 3. MILLISECOND LIVE CANDLE TICK ENGINE
function startRealtimeCandleTicks() {
    setInterval(() => {
        let lastCandle = candles[candles.length - 1];
        let priceFluctuation = (Math.random() * 0.12 - 0.058); // Millisecond fluctuation
        
        lastCandle.close += priceFluctuation;
        if (lastCandle.close > lastCandle.high) lastCandle.high = lastCandle.close;
        if (lastCandle.close < lastCandle.low) lastCandle.low = lastCandle.close;

        okbPrice = lastCandle.close;

        // Dynamic Text update
        document.getElementById("liveOkbPrice").textContent = "$" + okbPrice.toFixed(4);
        const priceDiff = lastCandle.close - lastCandle.open;
        const changeTag = document.getElementById("liveOkbChange");
        
        if (priceDiff >= 0) {
            changeTag.textContent = "▲ +" + ((priceDiff / lastCandle.open) * 100).toFixed(2) + "%";
            changeTag.className = "price-change-pill up";
        } else {
            changeTag.textContent = "▼ " + ((priceDiff / lastCandle.open) * 100).toFixed(2) + "%";
            changeTag.className = "price-change-pill down";
        }

        updateCalculations();
        drawCandlestickChart();
    }, 400); // 400ms Realtime Update

    // Push new Candle every 10 Seconds
    setInterval(() => {
        let lastClose = candles[candles.length - 1].close;
        candles.shift();
        candles.push({
            open: lastClose,
            high: lastClose + 0.05,
            low: lastClose - 0.05,
            close: lastClose
        });
    }, 10000);
}

// 4. FETCH COINGECKO LIVE MARKET LIST & PLATFORM CAP
async function loadCoinGeckoData() {
    try {
        const res = await fetch("https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=bitcoin,ethereum,binancecoin,solana,ripple,dogecoin&order=market_cap_desc&per_page=6&page=1&sparkline=false&price_change_percentage=24h", { cache: "no-store" });
        if (!res.ok) return;
        const data = await res.json();

        const btc = data.find(c => c.id === "bitcoin");
        const eth = data.find(c => c.id === "ethereum");
        if (btc) btcPrice = btc.current_price;
        if (eth) ethPrice = eth.current_price;

        const listContainer = document.getElementById("cryptoListContainer");
        listContainer.innerHTML = "";

        data.forEach(coin => {
            const ch = coin.price_change_percentage_24h || 0;
            const isUp = ch >= 0;
            listContainer.innerHTML += `
                <div class="coin-row">
                    <div class="row-left">
                        <img src="${coin.image}" class="coin-icon-img" alt="${coin.name}">
                        <div>
                            <div class="row-name">${coin.name}</div>
                            <div class="row-symbol">${coin.symbol.toUpperCase()}</div>
                        </div>
                    </div>
                    <div class="row-right">
                        <div>$${Number(coin.current_price).toLocaleString("en-US", { minimumFractionDigits: 2 })}</div>
                        <div class="price-change-pill ${isUp ? 'up' : 'down'}" style="margin-top:2px;">
                            ${isUp ? '▲ +' : '▼ '}${ch.toFixed(2)}%
                        </div>
                    </div>
                </div>
            `;
        });
    } catch (e) {
        console.error("Coingecko API Error: ", e);
    }
}

// 5. FIREBASE REAL-TIME USER BALANCE & TOTAL POOL MARKET CAP SYNC
document.addEventListener("DOMContentLoaded", () => {
    const userId = localStorage.getItem("okbUserId");
    
    // User Balance Listener
    if (userId) {
        const userRef = ref(db, 'users/' + userId);
        onValue(userRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                currentBdtBalance = Number(data.balance || data.mainBalance || 0);
                document.getElementById("userMainBalance").textContent = "৳" + currentBdtBalance.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                updateCalculations();
            }
        });
    } else {
        document.getElementById("userMainBalance").textContent = "৳0.00";
    }

    // Total Users / Platform Market Cap Realtime Sync
    const allUsersRef = ref(db, 'users');
    onValue(allUsersRef, (snapshot) => {
        let totalPoolBdt = 0;
        if (snapshot.exists()) {
            snapshot.forEach((child) => {
                const u = child.val();
                totalPoolBdt += Number(u.balance || u.mainBalance || 0);
            });
        }
        // Base market cap + total users balance
        const totalMarketCapUsd = (totalPoolBdt / BDT_TO_USD) + 1250000;
        document.getElementById("platformMarketCap").textContent = "$" + totalMarketCapUsd.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " USD";
    });

    // Start Engines
    loadCoinGeckoData();
    startRealtimeCandleTicks();
    setInterval(loadCoinGeckoData, 20000);
});

window.addEventListener("resize", drawCandlestickChart);
</script>

</body>
</html>
